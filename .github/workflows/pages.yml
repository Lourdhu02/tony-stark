name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docs site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install -r site/requirements.txt

      - name: References are generated and fresh
        run: python3 tools/refs/generate.py --check

      - name: Build site (strict)
        run: |
          python3 site/build.py
          mkdocs build --strict -f site/mkdocs.yml

  deploy:
    name: publish to gh-pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install -r site/requirements.txt

      - name: Build and push the site to the gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 site/build.py
          mkdocs gh-deploy --force --no-history -f site/mkdocs.yml
